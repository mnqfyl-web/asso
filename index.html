<!DOCTYPE html>
<html lang="fr">

<title>Événements de l'association</title>
<style>
  :root { --p: #2b6cb0; --pd: #2b6cb0; --pt: #fff; --s: #f59e0b; --f: #f7f7f8; --t: #1f2937; --ft: "Poppins"; --fx: "Nunito"; --photo: none; --emb-c: "✨"; }
  * { box-sizing: border-box; }
  body { margin: 0; }
  .page { min-height: 100vh; background: var(--f); color: var(--t); font-family: var(--fx), system-ui, sans-serif; font-size: 17px; line-height: 1.55; position: relative; overflow-x: hidden; }
  h1, h2, .type { font-family: var(--ft), Georgia, serif; }
  h1 { margin: 10px 0 8px; line-height: 1.1; }
  h2 { font-size: 21px; margin: 0 0 10px; color: var(--pd); }
  p { margin: 0 0 12px; white-space: pre-line; }
  a { color: var(--pd); }
  ul { margin: 0; padding-left: 22px; } li { margin-bottom: 6px; } li::marker { color: var(--p); }

  .deco { display: none; position: fixed; inset: 0; pointer-events: none; z-index: 1; }
  .deco span { position: absolute; font-size: 38px; }
  .apercu { background: #111; color: #fff; text-align: center; padding: 8px; font-size: 14px; position: relative; z-index: 20; }

  .hero { position: relative; z-index: 2; }
  .hero-photo { background-image: var(--photo), linear-gradient(135deg, var(--p), var(--s)); background-size: cover; background-position: center; display: flex; align-items: center; justify-content: center; }

  .type { display: inline-block; font-size: 15px; }
  .accroche { font-size: 20px; margin: 0 0 14px; opacity: .92; }
  .tuile { margin-bottom: 8px; } .tuile b { display: block; font-size: 18px; } .tuile small { display: block; opacity: .85; font-size: 15px; }
  .boutons { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
  .btn { display: inline-block; text-decoration: none; padding: 12px 18px; border-radius: 12px; font: inherit; font-size: 16px; border: 2px solid transparent; cursor: pointer; background: var(--p); color: var(--pt); }

  main { position: relative; z-index: 2; max-width: 820px; margin: 0 auto; padding: 18px; }

  .pied { text-align: center; padding: 10px 0 34px; position: relative; z-index: 2; opacity: .75; font-size: 14px; }
  .etat { text-align: center; padding: 70px 20px; color: #6b7280; font-family: system-ui, sans-serif; }

  /* ============ AFFICHE : grand titre, photo plein cadre ============ */
  .t-affiche .asso { color: #fff; }
  .t-affiche .hero { min-height: 82vh; display: flex; align-items: flex-end; margin-top: -76px; color: #fff; }
  .t-affiche .hero-photo { position: absolute; inset: 0; }
  .t-affiche .hero-photo::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.35), rgba(0,0,0,.78)); }
  .t-affiche .hero-photo .emb { position: relative; z-index: 1; opacity: .35; font-size: 220px; }
  .t-affiche .hero::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 46px; background: var(--f); clip-path: polygon(0 100%, 100% 100%, 100% 0); }
  .t-affiche .hero-in { position: relative; z-index: 2; padding: 30px 22px 70px; max-width: 820px; margin: 0 auto; width: 100%; }
  .t-affiche h1 { font-size: clamp(44px, 12vw, 100px); line-height: .94; text-transform: uppercase; }
  .t-affiche .type { background: var(--p); color: var(--pt); padding: 6px 16px; transform: rotate(-2deg); letter-spacing: .1em; text-transform: uppercase; }
  .t-affiche .tuile { background: var(--p); color: var(--pt); padding: 12px 18px; display: inline-block; margin: 0 10px 10px 0; vertical-align: top; }
  .t-affiche .btn.sec { color: #fff; border-color: #fff; }
  .t-affiche .carte { border-radius: 0; border-left: 10px solid var(--p); box-shadow: 7px 7px 0 var(--s); }

  /* ============ BROCANTE : papier vintage, tampon, ruban ============ */
  .t-brocante { background-image: radial-gradient(rgba(0,0,0,.06) 1px, transparent 1px); background-size: 14px 14px; }
  .t-brocante .deco { display: block; opacity: .1; } .t-brocante .deco span { font-size: 90px; }
  .t-brocante .hero { text-align: center; padding: 6px 18px 30px; }
  .t-brocante .hero-photo { width: min(88%, 480px); aspect-ratio: 4 / 3; margin: 0 auto 24px; border: 12px solid #fff; box-shadow: 0 10px 26px rgba(0,0,0,.22); transform: rotate(-2deg); }
  .t-brocante h1 { font-size: clamp(34px, 8vw, 62px); color: var(--pd); }
  .t-brocante .type { border: 3px double var(--pd); color: var(--pd); padding: 4px 16px; transform: rotate(-3deg); text-transform: uppercase; letter-spacing: .12em; }
  .t-brocante .infos { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 10px; }
  .t-brocante .tuile { border: 2px dashed var(--pd); padding: 10px 18px; background: rgba(255,255,255,.7); margin: 0; }
  .t-brocante .boutons { justify-content: center; }
  .t-brocante .carte { background: #fffdf6; border: 2px dashed color-mix(in srgb, var(--pd) 55%, transparent); border-radius: 6px; box-shadow: none; position: relative; margin-top: 30px; }
  .t-brocante .carte::before { content: ""; position: absolute; top: -13px; left: 50%; width: 96px; height: 24px; transform: translateX(-50%) rotate(-2deg); background: color-mix(in srgb, var(--s) 55%, transparent); }

  /* ============ FÊTE : dégradé vif, bulles, confettis ============ */
  .t-fete { background: linear-gradient(160deg, var(--p), var(--s)) fixed; }
  .t-fete .deco { display: block; } .t-fete .deco span { animation: flotte 6s ease-in-out infinite; opacity: .85; }
  @keyframes flotte { 0%, 100% { transform: translateY(0) rotate(-6deg); } 50% { transform: translateY(-22px) rotate(8deg); } }
  .t-fete .asso, .t-fete .hero { color: #fff; }
  .t-fete .hero { text-align: center; padding: 6px 18px 46px; }
  .t-fete .hero-photo { width: min(90%, 440px); aspect-ratio: 1 / 1; margin: 0 auto 22px; border-radius: 52% 48% 46% 54% / 55% 45% 55% 45%; border: 8px solid #fff; box-shadow: 0 14px 40px rgba(0,0,0,.3); }
  .t-fete h1 { font-size: clamp(38px, 10vw, 76px); text-shadow: 0 4px 0 rgba(0,0,0,.2); }
  .t-fete .type { background: #fff; color: var(--pd); padding: 7px 20px; border-radius: 99px; font-weight: 700; }
  .t-fete .infos { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 12px; }
  .t-fete .tuile { background: #fff; color: var(--t); border-radius: 24px; padding: 12px 20px; margin: 0; box-shadow: 0 6px 0 rgba(0,0,0,.16); }
  .t-fete .boutons { justify-content: center; }
  .t-fete .btn { background: #fff; color: var(--pd); } .t-fete .btn.sec { background: transparent; color: #fff; border-color: #fff; }
  .t-fete .carte { border-radius: 32px; box-shadow: 0 8px 0 rgba(0,0,0,.13); }
  .t-fete .pied { color: #fff; }

  /* ============ SOLIDAIRE : doux, formes organiques ============ */
  .t-solidaire .deco { display: block; opacity: .1; } .t-solidaire .deco span { font-size: 80px; }
  .t-solidaire .hero { display: grid; gap: 24px; padding: 8px 22px 30px; max-width: 920px; margin: 0 auto; }
  @media (min-width: 760px) { .t-solidaire .hero { grid-template-columns: 1fr 1fr; align-items: center; } }
  .t-solidaire .hero-photo { aspect-ratio: 1 / 1; border-radius: 60% 40% 55% 45% / 45% 55% 45% 55%; box-shadow: 0 0 0 16px color-mix(in srgb, var(--p) 16%, transparent); margin: 12px; }
  .t-solidaire h1 { color: var(--pd); font-size: clamp(32px, 6vw, 54px); }
  .t-solidaire .type { background: color-mix(in srgb, var(--p) 15%, #fff); color: var(--pd); padding: 5px 16px; border-radius: 99px; }
  .t-solidaire .tuile { background: #fff; border-radius: 20px; padding: 12px 18px; box-shadow: 0 2px 12px rgba(0,0,0,.07); }
  .t-solidaire .carte { border-radius: 30px; box-shadow: 0 4px 20px rgba(0,0,0,.07); }
  .t-solidaire .carte h2::before { content: var(--emb-c); margin-right: 8px; }

  /* ============ MODERNE : épuré, typographie ============ */
  .t-moderne .hero { display: flex; flex-direction: column; max-width: 900px; margin: 0 auto; padding: 14px 22px 6px; }
  .t-moderne .hero-in { order: 1; } .t-moderne .hero-photo { order: 2; aspect-ratio: 16 / 8; border-radius: 24px; margin-top: 18px; }
  .t-moderne h1 { font-size: clamp(38px, 8vw, 70px); letter-spacing: -.02em; line-height: 1.02; }
  .t-moderne .type { color: var(--pd); text-transform: uppercase; letter-spacing: .22em; font-size: 13px; font-weight: 700; border-bottom: 3px solid var(--p); padding-bottom: 4px; }
  .t-moderne .infos { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 1px; background: #e5e7eb; border: 1px solid #e5e7eb; border-radius: 16px; overflow: hidden; margin: 18px 0; }
  .t-moderne .tuile { background: #fff; padding: 16px 18px; margin: 0; }
  .t-moderne .carte { background: transparent; border-radius: 0; box-shadow: none; padding: 24px 0; margin: 0; border-top: 1px solid #e5e7eb; }

  /* ============ VERRE : liquid glass ============ */
  .t-verre { color: #fff; background: #0b1020; }
  .t-verre .fond { display: block; position: fixed; inset: -40px; background-image: var(--photo), linear-gradient(135deg, var(--p), var(--s)); background-size: cover; background-position: center; filter: blur(20px) saturate(1.3) brightness(.72); z-index: 0; }
  .t-verre a, .t-verre h2 { color: #fff; }
  .t-verre .hero { padding: 6px 18px 10px; max-width: 820px; margin: 0 auto; }
  .t-verre .hero-photo { height: 280px; border-radius: 30px; margin-bottom: 14px; border: 1px solid rgba(255,255,255,.4); box-shadow: 0 10px 40px rgba(0,0,0,.35); }
  .t-verre .hero-in, .t-verre .carte { background: linear-gradient(135deg, rgba(255,255,255,.24), rgba(255,255,255,.07)); -webkit-backdrop-filter: blur(26px) saturate(160%); backdrop-filter: blur(26px) saturate(160%); border: 1px solid rgba(255,255,255,.36); box-shadow: 0 10px 40px rgba(0,0,0,.3), inset 0 1px 1px rgba(255,255,255,.5); border-radius: 30px; color: #fff; }
  .t-verre .hero-in { padding: 24px; }
  .t-verre .type { background: rgba(255,255,255,.2); border: 1px solid rgba(255,255,255,.4); padding: 4px 16px; border-radius: 99px; }
  .t-verre h1 { font-size: clamp(34px, 7vw, 58px); }
  .t-verre .btn { background: rgba(255,255,255,.92); color: #111; } .t-verre .btn.sec { background: transparent; color: #fff; border-color: rgba(255,255,255,.7); }
  .t-verre .carte { box-shadow: 0 10px 40px rgba(0,0,0,.3), inset 0 1px 1px rgba(255,255,255,.5); }
  .t-verre .pied { color: #fff; }

  /* ================= v3 : finitions UX ================= */
  html { scroll-behavior: smooth; } body { -webkit-font-smoothing: antialiased; }
  h1 { text-wrap: balance; letter-spacing: -.01em; } p, li { text-wrap: pretty; }
  .t-brocante { --card-bg: #fffdf7; } .t-moderne { --card-bg: var(--f); }
  .btn { min-height: 48px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: transform .18s ease, box-shadow .18s ease, filter .18s; }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,.18); filter: brightness(1.05); }
  .btn:active { transform: scale(.97); }
  a:focus-visible, button:focus-visible { outline: 3px solid var(--s); outline-offset: 3px; }

  .compte { display: inline-flex; align-items: center; gap: 7px; margin-left: 8px; padding: 4px 13px; border-radius: 99px; font-size: 14px; font-weight: 700; background: color-mix(in srgb, currentColor 14%, transparent); vertical-align: middle; }
  .compte::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #22c55e; animation: pouls 2s infinite; }
  .compte.fini::before { background: #9ca3af; animation: none; }
  @keyframes pouls { 0% { box-shadow: 0 0 0 0 rgba(34,197,94,.6); } 70%, 100% { box-shadow: 0 0 0 9px rgba(34,197,94,0); } }

  .infos { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
  .tuile.date { display: flex; align-items: center; gap: 14px; }
  .cal { width: 58px; flex: none; border-radius: 14px; overflow: hidden; background: #fff; color: #111; text-align: center; box-shadow: 0 4px 12px rgba(0,0,0,.2); font-family: var(--fx), sans-serif; }
  .cal .mois { display: block; background: var(--p); color: var(--pt); font-size: 11px; font-weight: 700; letter-spacing: .08em; padding: 3px 0; }
  .cal .jour { display: block; font-size: 26px; font-weight: 700; line-height: 1.25; }

  .carte h2 { display: flex; align-items: center; gap: 12px; }
  .ico { width: 38px; height: 38px; flex: none; display: inline-flex; align-items: center; justify-content: center; border-radius: 12px; font-size: 19px; background: color-mix(in srgb, var(--p) 14%, #fff); }
  .t-verre .ico { background: rgba(255,255,255,.2); } .t-moderne .ico { background: transparent; border: 1px solid #e5e7eb; }
  .t-affiche .ico { border-radius: 0; background: var(--p); } .t-brocante .ico { background: transparent; }
  .t-solidaire .carte h2::before { content: none; }

  .frise { list-style: none; margin: 4px 0 0; padding: 0; position: relative; }
  .frise::before { content: ""; position: absolute; left: 87px; top: 14px; bottom: 14px; width: 2px; background: color-mix(in srgb, var(--p) 30%, transparent); }
  .frise li { display: grid; grid-template-columns: 76px 1fr; gap: 24px; padding: 8px 0; position: relative; align-items: baseline; margin: 0; }
  .frise li::after { content: ""; position: absolute; left: 82px; top: 17px; width: 12px; height: 12px; border-radius: 50%; background: var(--p); box-shadow: 0 0 0 4px var(--card-bg, #fff); }
  .frise .h { font-weight: 700; color: var(--pd); text-align: right; font-variant-numeric: tabular-nums; }
  .t-verre .frise .h { color: #fff; } .t-verre .frise::before { background: rgba(255,255,255,.4); } .t-verre .frise li::after { background: #fff; box-shadow: none; }

  .prix { display: flex; align-items: baseline; gap: 10px; padding: 8px 0; font-size: 18px; }
  .prix i { flex: 1; border-bottom: 2px dotted color-mix(in srgb, currentColor 35%, transparent); transform: translateY(-4px); }
  .prix b { font-family: var(--ft), serif; font-size: 22px; color: var(--pd); white-space: nowrap; }
  .t-verre .prix b { color: #fff; } .note { opacity: .8; font-size: 15px; margin: 8px 0 0; }

  .anim .rev { opacity: 0; transform: translateY(22px); transition: opacity .6s ease, transform .6s ease; }
  .anim .rev.vu { opacity: 1; transform: none; }

  .galerie img { aspect-ratio: 4 / 3; cursor: zoom-in; transition: transform .3s ease, box-shadow .3s ease; }
  .galerie img:hover { transform: scale(1.02); box-shadow: 0 10px 28px rgba(0,0,0,.25); }
  .hero-photo[data-zoom] { cursor: zoom-in; }
  #lb { position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,.92); display: none; align-items: center; justify-content: center; }
  #lb.ouvert { display: flex; } #lb img { max-width: 94vw; max-height: 88vh; border-radius: 12px; }
  #lb button { position: absolute; background: rgba(255,255,255,.16); color: #fff; border: 0; width: 52px; height: 52px; border-radius: 50%; font-size: 26px; cursor: pointer; }
  #lb .x { top: 16px; right: 16px; } #lb .p { left: 14px; top: 50%; margin-top: -26px; } #lb .n { right: 14px; top: 50%; margin-top: -26px; }

  .barre-action { display: none; }
  .pied a { color: inherit; font-weight: 700; }
  .chargement { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .chargement::before { content: ""; width: 38px; height: 38px; border-radius: 50%; border: 4px solid #d1d5db; border-top-color: #2b6cb0; animation: tourne .9s linear infinite; }
  @keyframes tourne { to { transform: rotate(360deg); } }

  @media (max-width: 760px) {
    .page { padding-bottom: 100px; }
    .barre-action { display: flex; position: fixed; left: 12px; right: 12px; bottom: 12px; z-index: 90; gap: 6px; padding: 8px; border-radius: 22px; background: rgba(20,20,30,.84);
      -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); box-shadow: 0 10px 30px rgba(0,0,0,.35); transform: translateY(150%); transition: transform .35s ease; }
    .barre-action.visible { transform: none; }
    .barre-action a, .barre-action button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; color: #fff; text-decoration: none; background: none; border: 0; font: inherit; font-size: 12px; padding: 6px 0; border-radius: 14px; cursor: pointer; }
    .barre-action .i { font-size: 21px; }
    .frise::before { left: 63px; } .frise li { grid-template-columns: 52px 1fr; gap: 20px; } .frise li::after { left: 58px; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; scroll-behavior: auto !important; } .anim .rev { opacity: 1; transform: none; } }
</style>

<script>
// ➜ Collez ici l'adresse de l'application web Apps Script (celle qui se termine par /exec)
const API_URL = 'https://script.google.com/macros/s/AKfycbxtLzyyxiWZnk0rcLAeWfMwMV3t248jiJHCyYUnvGaX1JS_Rk6McPCuaRk3aV8KIX4pLQ/exec';

const TYPES = { 'vide-grenier': 'Vide-grenier', 'loto': 'Loto', 'caritatif': 'Manifestation caritative', 'autre': 'Événement' };
const THEME_DEFAUT = { 'vide-grenier': 'brocante', 'loto': 'fete', 'caritatif': 'solidaire', 'autre': 'moderne' };
const EMOJI_DEFAUT = { 'vide-grenier': '🏷️', 'loto': '🎲', 'caritatif': '❤️', 'autre': '✨' };
const THEMES = ['affiche', 'brocante', 'fete', 'solidaire', 'moderne', 'verre'];
const POLICES_UNIQUES = ['Abril Fatface', 'Bebas Neue', 'DM Serif Display', 'Lobster', 'Pacifico'];

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const hexOk = (v) => /^#[0-9a-fA-F]{6}$/.test(String(v || ''));

/* ---------- couleurs ---------- */
const hex2rgb = (h) => [1, 3, 5].map((i) => parseInt(h.substr(i, 2), 16));
const rgb2hex = (a) => '#' + a.map((v) => Math.round(Math.max(0, Math.min(255, v))).toString(16).padStart(2, '0')).join('');
function lum(h) { const [r, g, b] = hex2rgb(h).map((v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }); return 0.2126 * r + 0.7152 * g + 0.0722 * b; }
function contraste(a, b) { const x = lum(a), y = lum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); }
function melange(a, b, k) { const x = hex2rgb(a), y = hex2rgb(b); return rgb2hex(x.map((v, i) => v * (1 - k) + y[i] * k)); }
function decaler(h, deg) {
  let [r, g, b] = hex2rgb(h).map((v) => v / 255);
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b); let H = 0, S = 0; const L = (mx + mn) / 2;
  if (mx !== mn) { const d = mx - mn; S = L > 0.5 ? d / (2 - mx - mn) : d / (mx + mn);
    H = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; H *= 60; }
  H = (H + deg + 360) % 360;
  const f = (n) => { const k = (n + H / 30) % 12; return L - S * Math.min(L, 1 - L) * Math.max(-1, Math.min(k - 3, 9 - k, 1)); };
  return rgb2hex([f(0) * 255, f(8) * 255, f(4) * 255]);
}
function assombrir(h, fond) { let c = h, n = 0; while (contraste(c, fond) < 4.5 && n < 12) { c = melange(c, '#000000', 0.12); n++; } return c; }

/* ---------- design ---------- */
function designFinal(ev, asso) {
  const d = ev.design || {};
  const base = (asso && hexOk(asso.couleur)) ? asso.couleur : '#2b6cb0';
  const p = hexOk(d.primaire) ? d.primaire : base;
  const s = hexOk(d.secondaire) ? d.secondaire : decaler(p, 40);
  let f = hexOk(d.fond) ? d.fond : melange(p, '#ffffff', 0.93);
  if (lum(f) < 0.55) f = melange(p, '#ffffff', 0.93);
  let t = hexOk(d.texte) ? d.texte : '#1f2937';
  if (contraste(t, f) < 4.5 || contraste(t, '#ffffff') < 4.5) t = '#1f2937';
  const theme = THEMES.indexOf(d.theme) >= 0 ? d.theme : (THEME_DEFAUT[ev.type] || 'moderne');
  return {
    theme: theme, p: p, s: s, f: f, t: t,
    pd: assombrir(p, '#ffffff'),
    pt: contraste('#ffffff', p) >= contraste('#111111', p) ? '#ffffff' : '#111111',
    ft: d.policeTitre || 'Poppins', fx: d.policeTexte || 'Nunito',
    emb: d.embleme || EMOJI_DEFAUT[ev.type] || '✨'
  };
}
function chargerPolices(ft, fx) {
  const fam = (n) => 'family=' + encodeURIComponent(n).replace(/%20/g, '+') + (POLICES_UNIQUES.indexOf(n) >= 0 ? '' : ':wght@400;700');
  const l = document.createElement('link'); l.rel = 'stylesheet';
  l.href = 'https://fonts.googleapis.com/css2?' + fam(ft) + '&' + fam(fx) + '&display=swap';
  document.head.appendChild(l);
}

/* ---------- utilitaires d'affichage ---------- */
function dateLongue(iso) {
  if (!iso) return '';
  const d = new Date(iso + 'T12:00:00'); if (isNaN(d)) return iso;
  const t = d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  return t.charAt(0).toUpperCase() + t.slice(1);
}
function lier(texte) {
  let t = esc(texte);
  t = t.replace(/([\w.+-]+@[\w-]+\.[\w.-]+)/g, '<a href="mailto:$1">$1</a>');
  t = t.replace(/(0\d(?:[ .]?\d{2}){4})/g, (m) => '<a href="tel:' + m.replace(/[^0-9]/g, '') + '">' + m + '</a>');
  return t;
}
function bloc(titre, ico, html) { return html ? '<section class="carte rev"><h2><span class="ico">' + ico + '</span>' + titre + '</h2>' + html + '</section>' : ''; }
function lienAgenda(ev) {
  if (!ev.date) return '';
  const d = ev.date.replace(/-/g, '');
  const fin = new Date(ev.date + 'T12:00:00'); fin.setDate(fin.getDate() + 1);
  const f = fin.getFullYear() + String(fin.getMonth() + 1).padStart(2, '0') + String(fin.getDate()).padStart(2, '0');
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text=' + encodeURIComponent(ev.titre) + '&dates=' + d + '/' + f +
    '&location=' + encodeURIComponent((ev.lieu + ' ' + ev.adresse).trim()) + '&details=' + encodeURIComponent(ev.accroche || '');
}
function decorations(emb) {
  const pos = [[6, 12], [88, 8], [12, 55], [82, 48], [4, 86], [90, 82], [48, 4], [50, 92]];
  return pos.map((p, i) => '<span style="left:' + p[0] + '%;top:' + p[1] + '%;animation-delay:' + (i * 0.7) + 's">' + esc(emb) + '</span>').join('');
}

/* ---------- page événement ---------- */
const MOIS = ['JAN', 'FÉV', 'MARS', 'AVR', 'MAI', 'JUIN', 'JUIL', 'AOÛT', 'SEPT', 'OCT', 'NOV', 'DÉC'];
function compteARebours(iso) {
  if (!iso) return null;
  const d = new Date(iso + 'T00:00:00'), n = new Date(); n.setHours(0, 0, 0, 0);
  const j = Math.round((d - n) / 86400000); if (isNaN(j)) return null;
  if (j < 0) return { t: 'Événement terminé', fini: true };
  return { t: j === 0 ? "C'est aujourd'hui !" : j === 1 ? 'Demain' : 'Dans ' + j + ' jours', fini: false };
}
function tuileDate(ev) {
  const d = new Date(ev.date + 'T12:00:00'); if (isNaN(d)) return '';
  return '<div class="tuile date"><div class="cal"><span class="mois">' + MOIS[d.getMonth()] + '</span><span class="jour">' + d.getDate() + '</span></div><div><b>' + esc(dateLongue(ev.date)) + '</b>' + (ev.heure ? '<small>🕒 ' + esc(ev.heure) + '</small>' : '') + '</div></div>';
}
function htmlProgramme(texte) {
  const lignes = (texte || '').split('\n').map((l) => l.trim()).filter(Boolean); if (!lignes.length) return '';
  const re = /^(\d{1,2}\s?(?:h|H|:)\s?\d{0,2})\s*[-–:]?\s*(.+)$/;
  const items = lignes.map((l) => { const m = re.exec(l); return m ? { h: m[1].replace(/\s/g, ''), x: m[2] } : { h: '', x: l }; });
  if (!items.some((x) => x.h)) return '<ul>' + items.map((x) => '<li>' + esc(x.x) + '</li>').join('') + '</ul>';
  return '<ol class="frise">' + items.map((x) => '<li><span class="h">' + esc(x.h || '•') + '</span><span class="x">' + esc(x.x) + '</span></li>').join('') + '</ol>';
}
function htmlTarifs(texte) {
  const lignes = (texte || '').split('\n').map((l) => l.trim()).filter(Boolean);
  return lignes.map((l) => { const m = /^(.*?)\s*:\s*(.+)$/.exec(l); return m ? '<div class="prix"><span>' + esc(m[1]) + '</span><i></i><b>' + esc(m[2]) + '</b></div>' : '<p class="note">' + esc(l) + '</p>'; }).join('');
}
function boutonsContact(texte) {
  const tel = /0\d(?:[ .]?\d{2}){4}/.exec(texte || ''), mail = /[\w.+-]+@[\w-]+\.[\w.-]+/.exec(texte || ''); let h = '';
  if (tel) h += '<a class="btn" href="tel:' + tel[0].replace(/[^0-9]/g, '') + '">📞 Appeler</a>';
  if (mail) h += '<a class="btn sec" href="mailto:' + esc(mail[0]) + '">✉️ Écrire</a>';
  return h ? '<div class="boutons">' + h + '</div>' : '';
}

function afficherEvenement(r) {
  const ev = r.event, asso = r.asso || {};
  const d = designFinal(ev, asso);
  chargerPolices(d.ft, d.fx);
  document.title = ev.titre + (asso.nom ? ' – ' + asso.nom : '');

  const photos = ev.photos || [];
  const photoHero = photos[0] || '';
  const autres = photos.slice(1);
  const lieu = (ev.lieu + (ev.adresse ? ', ' + ev.adresse : '')).trim();
  const carte = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(lieu + (asso.ville && lieu.indexOf(asso.ville) < 0 ? ' ' + asso.ville : ''));
  const agenda = lienAgenda(ev);
  const compte = compteARebours(ev.date);

  const style = '--p:' + d.p + ';--pd:' + d.pd + ';--pt:' + d.pt + ';--s:' + d.s + ';--f:' + d.f + ';--t:' + d.t +
    ';--ft:"' + d.ft + '";--fx:"' + d.fx + '";--emb-c:"' + d.emb.replace(/["\\]/g, '') + '"' +
    (photoHero ? ';--photo:url(\'' + photoHero + '\')' : '');

  let h = (r.apercu ? '<div class="apercu">👁️ Aperçu : cette page n\'est pas encore publiée</div>' : '');
  h += '<div class="page anim t-' + d.theme + '" style="' + esc(style) + '">';
  h += '<div class="fond"></div><div class="deco" aria-hidden="true">' + decorations(d.emb) + '</div>';
  h += '<header class="asso">' + (asso.logoUrl ? '<img src="' + esc(asso.logoUrl) + '" alt="Logo">' : '') +
    '<div><div class="nom">' + esc(asso.nom || '') + '</div><div class="ville">' + esc(asso.ville || '') + '</div></div></header>';
  h += '<section class="hero"><div class="hero-photo"' + (photoHero ? ' data-zoom="0"' : '') + '>' + (photoHero ? '' : '<span class="emb">' + esc(d.emb) + '</span>') + '</div>' +
    '<div class="hero-in"><span class="type">' + esc(TYPES[ev.type] || 'Événement') + '</span>' +
    (compte ? '<span class="compte' + (compte.fini ? ' fini' : '') + '">' + esc(compte.t) + '</span>' : '') +
    '<h1>' + esc(ev.titre) + '</h1>' + (ev.accroche ? '<p class="accroche">' + esc(ev.accroche) + '</p>' : '') +
    '<div class="infos">' + (ev.date ? tuileDate(ev) : '') +
    (lieu ? '<div class="tuile"><b>📍 ' + esc(ev.lieu || ev.adresse) + '</b>' + (ev.lieu && ev.adresse ? '<small>' + esc(ev.adresse) + '</small>' : '') + '</div>' : '') +
    '</div><div class="boutons">' +
    (lieu ? '<a class="btn" href="' + carte + '" target="_blank" rel="noopener">🗺️ Itinéraire</a>' : '') +
    (agenda ? '<a class="btn sec" href="' + agenda + '" target="_blank" rel="noopener">📅 Ajouter à mon agenda</a>' : '') +
    '<button class="btn sec" id="btnPartager">📤 Partager</button></div></div></section>';
  h += '<main>';
  if (autres.length) h += '<div class="galerie rev">' + autres.map((u, k) => '<img src="' + esc(u) + '" alt="" loading="lazy" data-zoom="' + (k + 1) + '">').join('') + '</div>';
  h += bloc('À propos', '💬', ev.description ? '<p>' + esc(ev.description) + '</p>' : '');
  h += bloc('Programme', '🕒', htmlProgramme(ev.programme));
  h += bloc('Tarifs', '💶', htmlTarifs(ev.tarifs));
  h += bloc('Inscription / réservation', '✍️', ev.inscription ? '<p>' + lier(ev.inscription) + '</p>' + boutonsContact(ev.inscription) : '');
  h += bloc('Contact', '📞', ev.contact ? '<p>' + lier(ev.contact) + '</p>' : '');
  if (asso.description) h += bloc('Qui sommes-nous ?', '🏛️', '<p>' + esc(asso.description) + '</p>');
  h += '</main><div class="pied">' + (asso.id ? '<a href="?a=' + encodeURIComponent(asso.id) + '">Tous les événements — ' + esc(asso.nom || '') + '</a>' : esc(asso.nom || '')) + '</div>';
  h += '<div class="barre-action" id="barreAction">' + (lieu ? '<a href="' + carte + '" target="_blank" rel="noopener"><span class="i">🗺️</span>Itinéraire</a>' : '') +
    (agenda ? '<a href="' + agenda + '" target="_blank" rel="noopener"><span class="i">📅</span>Agenda</a>' : '') + '<button id="btnPartager2"><span class="i">📤</span>Partager</button></div></div>';
  h += '<div id="lb" role="dialog" aria-label="Photo"><button class="x" aria-label="Fermer">✕</button><button class="p" aria-label="Précédente">‹</button><img alt=""><button class="n" aria-label="Suivante">›</button></div>';
  $('racine').innerHTML = h;

  const partager = async () => {
    const data = { title: ev.titre, text: ev.accroche || ev.titre, url: location.href };
    try { if (navigator.share) await navigator.share(data); else { await navigator.clipboard.writeText(location.href); alert('Adresse copiée !'); } } catch (e) { /* annulé */ }
  };
  $('btnPartager').onclick = partager; $('btnPartager2').onclick = partager;

  // photos agrandissables
  const lb = $('lb'); let cur = 0;
  const montrerPhoto = (k) => { cur = (k + photos.length) % photos.length; lb.querySelector('img').src = photos[cur]; };
  const fermer = () => { lb.classList.remove('ouvert'); };
  document.querySelectorAll('[data-zoom]').forEach((el) => { el.onclick = () => { montrerPhoto(Number(el.dataset.zoom)); lb.classList.add('ouvert'); }; });
  lb.querySelector('.x').onclick = fermer; lb.querySelector('.p').onclick = () => montrerPhoto(cur - 1); lb.querySelector('.n').onclick = () => montrerPhoto(cur + 1);
  lb.onclick = (e) => { if (e.target === lb) fermer(); };
  document.onkeydown = (e) => { if (!lb.classList.contains('ouvert')) return; if (e.key === 'Escape') fermer(); if (e.key === 'ArrowLeft') montrerPhoto(cur - 1); if (e.key === 'ArrowRight') montrerPhoto(cur + 1); };

  // apparition douce des blocs + barre d'actions mobile
  const revs = document.querySelectorAll('.rev');
  if ('IntersectionObserver' in window) {
    const obs = new IntersectionObserver((es) => es.forEach((en) => { if (en.isIntersecting) { en.target.classList.add('vu'); obs.unobserve(en.target); } }), { threshold: 0.12 });
    revs.forEach((el) => obs.observe(el));
    const barre = $('barreAction');
    new IntersectionObserver((es) => es.forEach((en) => barre.classList.toggle('visible', !en.isIntersecting)), { threshold: 0.05 }).observe(document.querySelector('.hero'));
  } else { revs.forEach((el) => el.classList.add('vu')); $('barreAction').classList.add('visible'); }
}

/* ---------- liste des événements d'une association ---------- */
function afficherListe(r) {
  const asso = r.asso;
  const p = hexOk(asso.couleur) ? asso.couleur : '#2b6cb0';
  const pd = assombrir(p, '#ffffff'), pt = contraste('#ffffff', p) >= contraste('#111111', p) ? '#ffffff' : '#111111';
  chargerPolices('Poppins', 'Nunito');
  document.title = 'Événements – ' + asso.nom;
  const aujourdhui = new Date().toISOString().slice(0, 10);
  const avenir = r.evenements.filter((e) => e.date >= aujourdhui).sort((a, b) => (a.date > b.date ? 1 : -1));
  const passes = r.evenements.filter((e) => e.date < aujourdhui);
  const ligne = (e) => '<a class="item" href="?e=' + encodeURIComponent(e.id) + '" style="display:block;text-decoration:none;color:inherit;padding:14px 0;border-bottom:1px solid #e5e7eb"><b style="font-size:18px">' +
    (EMOJI_DEFAUT[e.type] || '✨') + ' ' + esc(e.titre) + '</b><br>' + esc(TYPES[e.type] || '') + ' — ' + esc(dateLongue(e.date)) + (e.lieu ? ' — ' + esc(e.lieu) : '') + '</a>';
  let h = '<div class="page t-moderne" style="--p:' + p + ';--pd:' + pd + ';--pt:' + pt + '">';
  h += '<header class="asso" style="color:var(--t)">' + (asso.logoUrl ? '<img src="' + esc(asso.logoUrl) + '" alt="Logo" style="border:1px solid #e5e7eb">' : '') +
    '<div><div class="nom">' + esc(asso.nom) + '</div><div class="ville">' + esc(asso.ville) + '</div></div></header><main>';
  if (asso.description) h += '<div class="carte"><p>' + esc(asso.description) + '</p></div>';
  h += '<div class="carte"><h2>Prochains événements</h2>' + (avenir.length ? avenir.map(ligne).join('') : '<p>Aucun événement programmé pour le moment.</p>') + '</div>';
  if (passes.length) h += '<div class="carte"><h2>Événements passés</h2>' + passes.map(ligne).join('') + '</div>';
  h += '</main></div>';
  $('racine').innerHTML = h;
}

/* ---------- démarrage ---------- */
async function demarrer() {
  const p = new URLSearchParams(location.search);
  const e = p.get('e'), a = p.get('a'), k = p.get('k');
  if (API_URL.indexOf('COLLEZ_ICI') === 0) { $('racine').innerHTML = '<div class="etat">Site en cours de configuration.</div>'; return; }
  if (!e && !a) { $('racine').innerHTML = '<div class="etat">Bienvenue ! Scannez le QR code d\'une affiche pour voir un événement.</div>'; return; }
  try {
    const rep = await fetch(API_URL + '?' + (e ? 'e=' + encodeURIComponent(e) + (k ? '&k=' + encodeURIComponent(k) : '') : 'a=' + encodeURIComponent(a)));
    const r = await rep.json();
    if (!r.ok) throw new Error(r.erreur || 'Page introuvable.');
    if (k) { try { history.replaceState(null, '', location.pathname + '?e=' + encodeURIComponent(e)); } catch (x) { /* ignoré */ } }
    if (e) afficherEvenement(r); else afficherListe(r);
  } catch (err) {
    $('racine').innerHTML = '<div class="etat">😕 ' + esc(err.message || 'Cette page n\'est pas disponible pour le moment.') + '</div>';
  }
}
demarrer();
</script>
